# Package-owned: not part of the kit's managed workflows.
name: AD benchmarks

# Publishes the AD gradient numbers the AD comparison page renders.
# The page reads `history/results/latest.json` from the `benchmarks` branch.
# The managed history workflow writes that file, but it times six
# revisions of the whole suite in one job, which does not fit in the job's
# time limit, so the file stays at its last completed run.
# This workflow times only the registry's gradient grid, on the current
# commit, with one job per backend, and publishes the merged result as
# that file.
# It runs daily and on demand: its five jobs take several runner-hours, too
# many for every merge.
# On a pull request that changes it, it runs without publishing.

on:
  pull_request:
    paths:
      - '.github/workflows/ad-benchmarks.yaml'
      - 'benchmark/ad_latest.jl'
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:

# A newer push to a pull request supersedes its run; scheduled and
# on-demand runs all complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The backends `benchmark/benchmarks.jl` times.
        backend:
          - ForwardDiff
          - Enzyme forward
          - Enzyme reverse
          - Mooncake forward
          - Mooncake reverse
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - run: julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - name: Time the registry's gradients
        env:
          BENCHMARK_BACKENDS: ${{ matrix.backend }}
          BENCHMARK_MATRIX: 'false'
        run: julia --project=benchmark benchmark/run.jl results.json
      - uses: actions/upload-artifact@v7
        with:
          name: ad-results-${{ strategy.job-index }}
          path: results.json

  publish:
    needs: measure
    # A backend whose job failed still leaves the others to publish; the
    # merge step names it, and fails if it has no numbers at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - run: julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - uses: actions/download-artifact@v8
        with:
          pattern: ad-results-*
          path: results
      - name: Merge the backends
        run: |
          julia --project=benchmark benchmark/ad_latest.jl \
            public/latest.json results/*/results.json
      # `clean: false` replaces `latest.json` and leaves the history
      # workflow's other files on the branch as they are.
      - name: Deploy to benchmarks branch
        if: ${{ github.event_name != 'pull_request' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: benchmarks
          folder: public
          target-folder: history/results
          clean: false
          commit-message: >-
            AD gradient numbers for ${{ github.sha }}
