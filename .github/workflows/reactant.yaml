# Package-owned: not part of the kit's managed workflows.
name: Reactant

# Runs the Reactant support matrix in test/reactant/ on the CPU backend.
# The full matrix takes over an hour, so it runs weekly and on main, where
# a Reactant or Enzyme release that changes what works also shows up
# without a package change. Pull requests that change the recurrence, the
# convolution or an extension run a smoke subset: three cases, forward and
# reverse, at 20 steps.
# Each job fails when a cell it ran has a status that differs from the
# committed results.tsv (test/reactant/compare.jl), with the changed cells
# in the job summary. The test step only records results, so it may fail
# without failing the job; the comparison is the gate. The committed
# results are checked against expected.jl in the main test suite.
# The steps are the commands in the header of test/reactant/runtests.jl, so
# the job does not depend on the managed Taskfile.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/recurrence*.jl'
      - 'src/convolution.jl'
      - 'ext/**'
      - 'test/reactant/**'
      - '.github/workflows/reactant.yaml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Runs on main and the schedule are not cancelled by a later one, so each
# merge gets a result; a pull request's smoke run gives way to a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REACTANT_BACKENDS: cpu
      REACTANT_CASES: rec_single,rec_strata_I,conv_fixed
      REACTANT_STEPS: '20'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - run: julia --project=test/reactant -e 'using Pkg; Pkg.instantiate()'
      - run: mv test/reactant/results.tsv "$RUNNER_TEMP/committed.tsv"
      - run: julia --project=test/reactant --startup-file=no test/reactant/runtests.jl
        continue-on-error: true
      - name: Compare with the committed results
        run: |
          julia --startup-file=no test/reactant/compare.jl \
            "$RUNNER_TEMP/committed.tsv" test/reactant/results.tsv --subset \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  reactant:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      REACTANT_BACKENDS: cpu
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - run: julia --project=test/reactant -e 'using Pkg; Pkg.instantiate()'
      # Moved, so a run that writes no results fails the comparison.
      - run: mv test/reactant/results.tsv "$RUNNER_TEMP/committed.tsv"
      # The test set marks expected failures broken, so an unexpected pass
      # fails this step; the comparison below reports which cells changed
      # and fails the job.
      - run: julia --project=test/reactant --startup-file=no test/reactant/runtests.jl
        continue-on-error: true
      - name: Compare with the committed results
        run: |
          julia --startup-file=no test/reactant/compare.jl \
            "$RUNNER_TEMP/committed.tsv" test/reactant/results.tsv \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reactant-results
          path: |
            test/reactant/RESULTS.md
            test/reactant/results.tsv
