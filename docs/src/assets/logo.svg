<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="ComposableRecurrences.jl logo">
  <title>ComposableRecurrences.jl logo</title>
  <desc>Two strata of a time series. Each stratum's latest value is built from a weighted window of its own past, and the strata are coupled.</desc>
  <polygon points="200,30 364.5,125 364.5,315 200,410 35.5,315 35.5,125" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" opacity="0.4"/>

  <!-- Earlier history and the coupling between strata -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3">
    <path d="M 105,150 L 133,150"/>
    <path d="M 105,215 L 133,215"/>
    <path d="M 254,158 L 288,203"/>
    <path d="M 254,207 L 288,162"/>
  </g>

  <!-- Lag windows: arc width and opacity fall with the lag -->
  <g fill="none" stroke="#0ea5e9" stroke-linecap="round">
    <path d="M 145,140 Q 222,15 300,135" stroke-width="2.5" opacity="0.45"/>
    <path d="M 195,140 Q 247,55 300,135" stroke-width="4" opacity="0.7"/>
    <path d="M 245,140 Q 272,90 300,135" stroke-width="6"/>
  </g>
  <g fill="none" stroke="#10b981" stroke-linecap="round">
    <path d="M 145,225 Q 222,350 300,230" stroke-width="2.5" opacity="0.45"/>
    <path d="M 195,225 Q 247,310 300,230" stroke-width="4" opacity="0.7"/>
    <path d="M 245,225 Q 272,275 300,230" stroke-width="6"/>
  </g>

  <g fill="#0ea5e9">
    <circle cx="95" cy="150" r="9" opacity="0.4"/>
    <circle cx="145" cy="150" r="10"/>
    <circle cx="195" cy="150" r="10"/>
    <circle cx="245" cy="150" r="10"/>
    <circle cx="300" cy="150" r="15"/>
  </g>
  <g fill="#10b981">
    <circle cx="95" cy="215" r="9" opacity="0.4"/>
    <circle cx="145" cy="215" r="10"/>
    <circle cx="195" cy="215" r="10"/>
    <circle cx="245" cy="215" r="10"/>
    <circle cx="300" cy="215" r="15"/>
  </g>

  <text x="200" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#64748b" text-anchor="middle">Composable</text>
  <text x="200" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">Recurrences.jl</text>
</svg>
