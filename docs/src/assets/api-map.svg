<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <style>
    .bg { fill: none; }
    .box { fill: #eef4fb; stroke: #888; }
    .band { fill: #fbf3e6; stroke: #888; }
    .line { stroke: #888; }
    .head { fill: #888; }
    text { fill: #222; }
    text.note { fill: #888; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1f2a3a; stroke: #aaa; }
      .band { fill: #3a3020; stroke: #aaa; }
      .line { stroke: #aaa; }
      .head { fill: #aaa; }
      text { fill: #e6e6e6; }
      text.note { fill: #aaa; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="330"/>
  <g class="box" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="80" rx="8"/>
    <rect x="340" y="20" width="280" height="80" rx="8"/>
    <rect x="660" y="20" width="280" height="80" rx="8"/>
    <rect x="20" y="200" width="320" height="80" rx="8"/>
    <rect x="380" y="200" width="260" height="80" rx="8"/>
    <rect x="680" y="200" width="260" height="80" rx="8"/>
  </g>
  <rect x="20" y="120" width="920" height="44" rx="8" class="band" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="160" y="45" font-weight="bold">Kernel</text>
    <text x="160" y="67" font-size="12">weights on each lag:</text>
    <text x="160" y="85" font-size="12">a vector or a delay distribution</text>
    <text x="480" y="45" font-weight="bold">Coupling</text>
    <text x="480" y="67" font-size="12">mixes the strata:</text>
    <text x="480" y="85" font-size="12">a strata × strata matrix</text>
    <text x="800" y="45" font-weight="bold">Modifiers</text>
    <text x="800" y="67" font-size="12">change each step in order:</text>
    <text x="800" y="85" font-size="12">Depletion, Transform, Redistribute, Allocate</text>
    <text x="480" y="140" font-weight="bold">Shapes</text>
    <text x="480" y="156" font-size="12">PerStratum, Pairwise, TimeVarying, Derived and Recent set how a coefficient varies</text>
    <text x="180" y="225" font-weight="bold">Operator</text>
    <text x="180" y="247">Recurrence(kernel; coupling, modifiers)</text>
    <text x="180" y="267">Convolution(kernel)</text>
    <text x="510" y="225" font-weight="bold">Call</text>
    <text x="510" y="247">op(gain; history, add)</text>
    <text x="510" y="267" font-size="12">returns the output, a State or a trace</text>
    <text x="810" y="225" font-weight="bold">Executor</text>
    <text x="810" y="247" font-size="12">where a call's loops run:</text>
    <text x="810" y="265" font-size="12">Serial, Threaded or Parallel</text>
  </g>
  <g class="line" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="160" y1="164" x2="120" y2="198"/>
    <line x1="480" y1="164" x2="200" y2="198"/>
    <line x1="800" y1="164" x2="280" y2="198"/>
    <line x1="680" y1="240" x2="642" y2="240"/>
    <line x1="340" y1="240" x2="378" y2="240"/>
  </g>
  <g class="line" stroke-width="1.5" fill="none">
    <line x1="160" y1="100" x2="160" y2="120"/>
    <line x1="480" y1="100" x2="480" y2="120"/>
    <line x1="800" y1="100" x2="800" y2="120"/>
  </g>
  <text x="480" y="312" text-anchor="middle" font-size="12" class="note">A Convolution takes a kernel only: it has no coupling and no modifiers.</text>
</svg>
